<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="domGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f3e5c8"/>
      <stop offset="50%" stop-color="#d8c292"/>
      <stop offset="100%" stop-color="#aa8f58"/>
    </linearGradient>
    <linearGradient id="bgDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#162536"/>
      <stop offset="100%" stop-color="#0a1420"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background with cathedral shape -->
  <rect width="64" height="64" rx="14" fill="url(#bgDark)"/>
  <rect x="1.5" y="1.5" width="61" height="61" rx="12.5" stroke="url(#domGold)" stroke-width="1.5" stroke-opacity="0.3"/>
  
  <!-- Cathedral Arch & 5 harmonic vocal waves / lines (Pentavox) -->
  <path d="M14 50 L14 28 C14 18, 32 10, 32 10 C32 10, 50 18, 50 28 L50 50" stroke="url(#domGold)" stroke-width="2" stroke-linecap="round" fill="none"/>
  
  <!-- 5 Vocal Harmonies (Sopran, Alt, Tenor, Bariton, Bass) -->
  <!-- 1. Sopran (High arc) -->
  <circle cx="32" cy="18" r="2.5" fill="url(#domGold)" filter="url(#glow)"/>
  <!-- 2. Alt -->
  <path d="M22 28 Q32 23 42 28" stroke="url(#domGold)" stroke-width="1.8" stroke-linecap="round"/>
  <!-- 3. Tenor -->
  <path d="M19 35 Q32 30 45 35" stroke="url(#domGold)" stroke-width="2" stroke-linecap="round"/>
  <!-- 4. Bariton -->
  <path d="M21 42 Q32 38 43 42" stroke="url(#domGold)" stroke-width="2.2" stroke-linecap="round"/>
  <!-- 5. Bass (Foundation) -->
  <path d="M24 49 Q32 46 40 49" stroke="url(#domGold)" stroke-width="2.5" stroke-linecap="round"/>
  
  <!-- Center Resonance Axis -->
  <line x1="32" y1="21" x2="32" y2="46" stroke="url(#domGold)" stroke-width="1" stroke-dasharray="2 2" stroke-opacity="0.6"/>
</svg>
