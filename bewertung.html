<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Feedback einholen – five elements (Intern)</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,SOFT,wght@9..144,100,600..700&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body class="section-periwinkle" style="min-height:100dvh; display:flex; align-items:center; padding-block:2rem;">
  <main class="container" style="max-width:680px;">
    <section class="wizard-card">
      <div style="display:flex; align-items:center; gap:0.75rem; margin-bottom:1rem;">
        <img src="/favicon.svg" alt="five elements Signet" width="40" height="40" style="border-radius:12px;" />
        <div>
          <span class="eyebrow">Internes Feedback-Werkzeug</span>
          <h1 class="display-title" style="font-size:clamp(1.4rem, 3vw, 2rem); color:var(--fe-midnight); margin-top:0.35rem;">
            Rückmeldung per WhatsApp anfragen
          </h1>
        </div>
      </div>

      <p style="margin:0 0 1.25rem; color:var(--fe-ink-muted); font-size:0.93rem;">
        Nach einer gelungenen Trauung, einem Empfang oder Konzert einfach Nummer &amp; Vornamen eingeben – der vorbereitete WhatsApp-Text startet sofort ohne App-Zwischenschritt.
      </p>

      <form id="reviewHelperForm" novalidate>
        <div class="form-field">
          <label for="customerName">Vorname / Gastgeber *</label>
          <input type="text" id="customerName" placeholder="z. B. Anna &amp; Lukas" required />
        </div>
        <div class="form-field">
          <label for="customerPhone">Handynummer / WhatsApp *</label>
          <input type="tel" id="customerPhone" inputmode="tel" placeholder="z. B. 0176 12345678 oder +49…" required />
        </div>
        <div class="form-field">
          <label for="reviewLinkInput">Google / Bewertungs-Link (optional)</label>
          <input type="url" id="reviewLinkInput" placeholder="[MANUELL PRUEFEN: Euren Google-Bewertungslink einfügen]" />
        </div>

        <div style="display:flex; flex-wrap:wrap; gap:0.65rem; margin-top:1rem;">
          <button type="submit" class="btn btn-primary">WhatsApp-Nachricht öffnen</button>
          <a href="/" class="btn btn-pastel">Zur Startseite</a>
        </div>
      </form>

      <div id="reviewStatusBox" class="form-feedback" hidden></div>
    </section>
  </main>
  <script defer src="/assets/js/bewertung.js"></script>
</body>
</html>
